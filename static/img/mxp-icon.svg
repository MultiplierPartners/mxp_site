<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The MXP mark, as paths: a favicon is drawn by the browser with whatever
       fonts it has, so the letterforms cannot be text.

       Two things differ from the wordmark this is cut from, and both are
       forced by the slot. The lockup is wide and a favicon is square, so it
       sits in a band across the tile rather than filling it. And the
       gradient's dark end is lifted — the wordmark runs to charcoal at the
       baseline, which on a near-black tile is the lower half of every letter
       going missing. See mxp-wordmark.svg for the mark as drawn. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0.16" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.30" stop-color="#e2e5e9"/>
      <stop offset="0.64" stop-color="#b3b9c0"/>
      <stop offset="1"    stop-color="#79808a"/>
    </linearGradient>
    <linearGradient id="steelP" x1="0" y1="0" x2="0.16" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#e9ecef"/>
      <stop offset="0.66" stop-color="#bcc2c9"/>
      <stop offset="1"    stop-color="#828993"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="12"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="12" fill="#050505"/>
  <g clip-path="url(#tile)">
    <!-- 64 / 210 wide, centred on the tile. -->
    <g transform="translate(1.5 15.2) scale(0.29)">
      <g stroke="#9aa0a8" stroke-width="0.7" opacity="0.48" fill="none" stroke-linecap="round">
        <path d="M17 6 V96 M27 14 V88 M63 2 V70 M71 24 V104 M112 4 V82
                 M137 16 V100 M158 8 V64 M191 20 V92"/>
        <path d="M10 26 H84 M118 30 H200 M52 78 H150"/>
        <path d="M6 88 L30 10 M56 104 L82 18 M104 100 L128 22 M150 106 L176 26"/>
        <path d="M22 20 L34 34 M126 12 L138 26 M164 74 L176 88"/>
      </g>
      <g>
        <path fill="url(#steel)" d="M12 84 V26 H25 L39 66 L53 26 H66 V84 H57 V44 L43 78 H35 L21 44 V84 Z"/>
        <path fill="url(#steel)" d="M64 26 L78 26 L100 54 L122 26 L136 26 L109 55 L136 84 L122 84 L100 58 L78 84 L64 84 L91 55 Z"/>
        <path fill="url(#steelP)" fill-rule="evenodd"
              d="M134 84 V26 H173 a21 21 0 0 1 0 42 H147 V84 Z
                 M147 38 H173 a10 10 0 0 1 0 20 H147 Z"/>
      </g>
    </g>
  </g>
</svg>
